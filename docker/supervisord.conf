[supervisord]
nodaemon=true
logfile=/www/wwwroot/StarCore/logs/supervisord.log
pidfile=/run/supervisord.pid
childlogdir=/www/wwwroot/StarCore/logs

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:redis]
user=www-data
command=/usr/bin/redis-server /etc/redis/redis.conf
priority=10
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/www/wwwroot/StarCore/logs/redis.log
stderr_logfile=/www/wwwroot/StarCore/logs/redis-error.log
stopasgroup=true
killasgroup=true

[program:bootstrap]
command=/usr/local/bin/starcore-bootstrap
priority=20
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=0
startretries=20
stdout_logfile=/www/wwwroot/StarCore/logs/bootstrap.log
stderr_logfile=/www/wwwroot/StarCore/logs/bootstrap-error.log
stopasgroup=true
killasgroup=true

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
priority=30
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/www/wwwroot/StarCore/logs/php-fpm.log
stderr_logfile=/www/wwwroot/StarCore/logs/php-fpm-error.log
stopasgroup=true
killasgroup=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=30
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/www/wwwroot/StarCore/logs/nginx.log
stderr_logfile=/www/wwwroot/StarCore/logs/nginx-error.log
stopasgroup=true
killasgroup=true

[program:starcore-daemon]
user=www-data
command=/usr/local/bin/starcore-daemon
priority=40
autostart=true
autorestart=true
startsecs=3
startretries=100
stdout_logfile=/www/wwwroot/StarCore/logs/daemon.log
stderr_logfile=/www/wwwroot/StarCore/logs/daemon-error.log
stopasgroup=true
killasgroup=true
